<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дошка оголошень</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
      {
        "imports": {
          "zod": "https://esm.run/zod"
        }
      }
    </script>
    <script type="module" src="./dist/frontend/src/main.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="logo">Одна помилка і ти помилився</div>
        
        <div class="user-panel">
            <button type="button" id="auth-btn" class="btn outline">Увійти</button>
            
            <span id="user-greeting" hidden>
                <button type="button" id="open-profile-btn" class="btn outline small" >Профіль</button>
                Привіт, <span id="user-name-display"></span>
            </span>
        </div>
    </header>
           <div id="notice" class="notice-container"></div>

    <div class="layout-wrapper">
        
        <div class="sidebar">
            <h3>Категорії</h3>
            <ul id="category-list" class="category-menu">
                <li class="active" data-category="Всі категорії">Всі категорії</li>
                <li data-category="Новини">Новини</li>
                <li data-category="Події">Події</li>
                <li data-category="Загублені речі">Загублені речі</li>
                <li data-category="Навчання">Навчання</li>
                <li data-category="Спорт">Спорт</li>
                <li data-category="Меми">Меми</li>
            </ul>
         </div>
  
        <main id="app-root" class="content">
            
            <div id="view-list" class="view-section">
                
                <div class="toolbar">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Пошук за заголовком...">
                    </div>
                    <button type="button" id="create-post-btn" class="btn primary">Створити пост</button>
                </div>

                <div class="table-container">
                    <table id="posts-table">
                        <thead>
                            <tr>
                                <th>Заголовок</th>
                                <th>Категорія</th>
                                <th>Текст</th>
                                <th>Автор</th>
                                <th id="sort-date-th">
                                    Дата <span id="sort-arrow">▼</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="posts-body">
                            </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
            <div id="view-form" class="view-section" hidden>
    <div class="toolbar">
        <h2>Створити оголошення</h2>
        <button type="button" id="back-to-list-btn" class="btn outline">Назад до списку</button>
    </div>

    <form id="create-post-form" class="panel">
        <div class="field">
            <label for="title">Заголовок</label>
            <input type="text" id="title" name="title" maxlength="70" placeholder="Що продаємо/шукаємо?">
            <div id="titleError" class="error-text"></div> 
        </div>

        <div class="field">
            <label for="category">Категорія</label>
            <select id="category" name="category">
                <option value="" disabled selected>Оберіть категорію...</option>
                <option value="Новини">Новини</option>
                <option value="Події">Події</option>
                <option value="Загублені речі">Загублені речі</option>
                <option value="Навчання">Навчання</option>
                <option value="Спорт">Спорт</option>
                <option value="Меми">Меми</option>
            </select>
            <div id="categoryError" class="error-text"></div>
        </div>

        <div class="field">
            <label for="content">Текст оголошення</label>
            <textarea id="content" name="content" rows="4" maxlength="500" placeholder="Опишіть деталі..."></textarea>
            <div id="contentError" class="error-text"></div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn primary">Опублікувати</button>
        </div>
    </form>
</div>
            <div id="view-post" class="view-section" hidden>
                </div>

        </main>
    </div>
    <div id="user-modal-overlay" class="modal-overlay" hidden>
        <div class="modal-content panel">
            <div class="toolbar">
                <h2 id="modal-title">Створити акаунт</h2>
                <button type="button" id="close-user-modal-btn" class="btn outline">Закрити</button>
            </div>
            <form id="create-user-form">
                <div class="field" id="name-field-wrapper">
                    <label for="user-name">Ім'я</label>
                    <input type="text" id="user-name" name="name" placeholder="Введіть ваше ім'я">
                </div>
                <div class="field">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="email" placeholder="example@knu.ua">
                </div>
                <div class="form-actions">
                    <button type="submit" id="modal-submit-btn" class="btn primary">Зареєструватися</button>
                </div>
                <div>
                    <a href="#" id="toggle-auth-mode">Вже маєте акаунт? Увійти</a>
                </div>
            </form>
        </div>
    </div>

    <div id="profile-modal-overlay" class="modal-overlay" hidden>
        <div class="modal-content panel">
            <div class="toolbar">
                <h2>Мій профіль</h2>
                <button type="button" id="close-profile-btn" class="btn outline">Закрити</button>
            </div>
            
            <form id="edit-profile-form">
                <div class="field">
                    <label for="profile-name">Ім'я</label>
                    <input type="text" id="profile-name" name="name">
                    <div id="profileNameError" class="error-text"></div> </div>

                <div class="field">
                    <label for="profile-email">Email</label>
                    <input type="email" id="profile-email" name="email">
                    <div id="profileEmailError" class="error-text"></div> </div>

                <div class="form-actions">
                    
                    <button type="submit" class="btn primary">
                        Зберегти зміни
                    </button>
                    
                    <div>
                        <button type="button" id="profile-logout-btn" class="btn outline">
                            Вийти
                        </button>
                        
                        <button type="button" id="profile-delete-btn" class="btn delete">
                            Видалити
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
